# Serendipid backend. Usage:
#   cp .env.example .env   # add at least one AI provider key
#   docker compose up -d --build
#   docker compose exec serendipid-api python utils/manage_token.py show   # the API token
#
# All state lives in named volumes, so rebuilding or recreating the container
# keeps your database, media, token and config.

services:
  serendipid-api:
    image: serendipid:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serendipid-api

    ports:
      - "${API_PORT:-5050}:5050"

    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Persistent state, all on the serendipid-data volume
      DATABASE_PATH: /app/data/serendipid.db
      MEDIA_DIR: /app/data/media
      SERENDIPID_TOKEN_FILE: /app/data/token.txt

      # Docker's equivalents of start.py's --show-sensitive / --prefer flags
      SERENDIPID_SHOW_SENSITIVE: ${SERENDIPID_SHOW_SENSITIVE:-0}
      SERENDIPID_PREFERRED_PROVIDER: ${SERENDIPID_PREFERRED_PROVIDER:-}

      # Comma-separated origins allowed to call the API from a browser.
      # Unset = any origin (no credentials). The web app calls the backend
      # server-side, so it doesn't need an entry here.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}

      # AI providers (set the ones you have in .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
      OPENAI_CHAT_API_KEY: ${OPENAI_CHAT_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_TEXT_MODEL: ${ANTHROPIC_TEXT_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-immediate}

      # Optional Instagram login (a secondary account is recommended)
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}

      # The image has no local Whisper, so transcription uses Groq's API
      WHISPER_USE_CLOUD: ${WHISPER_USE_CLOUD:-true}

    volumes:
      - serendipid-data:/app/data            # database, media, token
      - serendipid-config:/app/config        # user_config.json, keys saved from the UI, router state
      - serendipid-thumbnails:/app/static/thumbnails
      - serendipid-uploads:/app/uploads      # Instagram export files uploaded from the web app
      - serendipid-temp:/app/temp
      - serendipid-logs:/app/logs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  serendipid-data:
  serendipid-config:
  serendipid-thumbnails:
  serendipid-uploads:
  serendipid-temp:
  serendipid-logs:
