name: Serendipid
options:
  bundleIdPrefix: com.serendipid.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SerendipidCore:
    path: SerendipidCore

targets:
  Serendipid:
    type: application
    platform: iOS
    sources:
      - path: Serendipid
        excludes:
          - "Info.plist"
          - "Serendipid.entitlements"
    info:
      path: Serendipid/Info.plist
      properties:
        CFBundleDisplayName: Serendipid
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Serendipid uses your camera to scan a QR code from your backend so you can connect without typing the server address and access token by hand."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Serendipid/Serendipid.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serendipid.ios.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.serendipid.ios.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serendipid.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SerendipidCore
        product: SerendipidCore
      - target: SerendipidShareExtension
        embed: true

  SerendipidShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SerendipidShareExtension
        excludes:
          - "Info.plist"
          - "SerendipidShareExtension.entitlements"
    info:
      path: SerendipidShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Serendipid
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
    entitlements:
      path: SerendipidShareExtension/SerendipidShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.serendipid.ios.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.serendipid.ios.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serendipid.ios.ShareExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
    dependencies:
      - package: SerendipidCore
        product: SerendipidCore

schemes:
  Serendipid:
    build:
      targets:
        Serendipid: all
    run:
      config: Debug
    test:
      config: Debug
  SerendipidShareExtension:
    build:
      targets:
        SerendipidShareExtension: all
    run:
      config: Debug
      executable: Serendipid.app
